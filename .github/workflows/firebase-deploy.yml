name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write and check service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAMIGOLF1 }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" <<'EOF'
          import json, sys
          try:
              k = json.load(open(sys.argv[1]))
          except Exception:
              sys.exit("The FIREBASE_SERVICE_ACCOUNT_CHAMIGOLF1 secret is not the key file. Paste the whole .json file from Firebase > Project settings > Service accounts > Firebase Admin SDK > Generate new private key.")
          if k.get("type") != "service_account" or "private_key" not in k:
              sys.exit("The secret is JSON but not a service account key file.")
          print("Key OK for", k.get("client_email"), "in project", k.get("project_id"))
          EOF

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --project chamigolf1 --only hosting --non-interactive

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
