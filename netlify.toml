# Netlify hosting for Red & Gold Golf (for Wi-Fi that blocks github.io and vercel.app).
# Plain static site: no build step, the repo root is the site.
# Connect it once: netlify.com > Add new site > Import an existing project > GitHub > ChamiGolf/chamigolf.github.io > Deploy.
# Then add the new *.netlify.app address in Firebase console > Authentication > Settings > Authorized domains (for Google sign-in).

[build]
  publish = "."
  command = ""

# Single-page game: any unknown path loads the game (real files like version.json are served as-is).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the newest game and version file, so the "Update ready" pop-up works.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
